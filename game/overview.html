<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배금도시 — 스토리 아틀라스</title>
<style>
  :root{
    --ink:#f5efe2; --muted:#9a9384; --bg:#0e0f12; --panel:#181a1e; --panel2:#202329;
    --line:rgba(245,239,226,.14); --gold:#d8b45d; --red:#e0483c; --green:#1db089; --blue:#3f7fe6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--ink); font-family:"Gothic A1",system-ui,sans-serif; line-height:1.5; padding:18px; }
  body.dock-open{padding-right:min(46vw,520px)}
  a{color:inherit}
  h1{font-size:20px; font-weight:800}
  .sub{color:var(--muted); font-size:13px; margin-top:2px}

  .toolbar{position:sticky; top:0; z-index:5; background:rgba(14,15,18,.96); backdrop-filter:blur(4px);
    border-bottom:1px solid var(--line); padding:12px 4px; margin:-18px -18px 16px; padding-inline:18px}
  .pills{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .pill{font-size:12px; font-weight:800; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:var(--panel)}
  .pill b{color:var(--gold)}
  .pill.bad b{color:var(--red)}
  .pill.warn b{color:var(--gold)}
  .pill.ok b{color:var(--green)}
  .note-actions{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px}
  .note-btn{border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:7px;
    padding:6px 10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer}
  .note-btn:hover{border-color:var(--gold)}
  .note-btn.primary{background:var(--gold); color:#17130b; border-color:var(--gold)}
  .note-status{font-size:12px; color:var(--muted)}
  .note-status.ok{color:var(--green)}
  .note-status.warn{color:var(--gold)}

  details.box{margin-bottom:14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden}
  details.box>summary{cursor:pointer; padding:10px 14px; font-weight:800; font-size:14px; list-style:none}
  summary::-webkit-details-marker{display:none}
  details.box>summary::before{content:"▸ "; color:var(--muted)}
  details.box[open]>summary::before{content:"▾ "}
  .pad{padding:6px 14px 14px}
  .problem{font-size:13px; padding:3px 0; color:var(--muted)}
  .problem a{color:var(--blue); text-decoration:underline; cursor:pointer}
  .problem.red a{color:var(--red)}
  .legend{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; border:1px solid var(--line)}
  .chip.stat{color:#eab; border-color:rgba(224,72,60,.4)}
  .chip.flag{color:#9cd; border-color:rgba(63,127,230,.4)}
  .chip.money{color:var(--green); border-color:rgba(29,176,137,.4)}
  .chip .v{opacity:.85}
  code{font-family:ui-monospace,Menlo,Consolas,monospace}

  /* ---- 주차 흐름도 ---- */
  .week{margin:16px 0; border:1px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden}
  .week>summary{cursor:pointer; list-style:none; padding:11px 14px; display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:15px; background:linear-gradient(180deg,rgba(216,180,93,.08),transparent)}
  .week>summary::before{content:"▾"; color:var(--gold); font-size:12px}
  .week:not([open])>summary::before{content:"▸"}
  .week .wlabel{color:var(--gold)}
  .week .wcount{color:var(--muted); font-size:12px; font-weight:700}
  .week .wend{margin-left:auto; font-size:11px; color:var(--muted); font-weight:700}
  .flow{padding:8px 14px 16px}

  .nodewrap{margin-left:calc(var(--lane,0) * 26px); position:relative}
  .nodewrap.lane-1::before, .nodewrap.lane-2::before{content:""; position:absolute; left:-14px; top:-6px; bottom:50%;
    width:12px; border-left:2px solid rgba(63,127,230,.5); border-bottom:2px solid rgba(63,127,230,.5);
    border-bottom-left-radius:8px}
  .node{position:relative; border:1px solid var(--line); border-left:3px solid var(--line); border-radius:9px;
    background:var(--panel2); padding:8px 11px; margin:6px 0 2px; cursor:pointer; transition:border-color .12s, box-shadow .12s}
  .node:hover{border-color:var(--gold)}
  .node.spine{border-left-color:var(--gold)}
  .node.branch{border-left-color:var(--blue)}
  .node.is-end{border-left-color:#e7c879; background:#211d12}
  .node.is-start{border-left-color:var(--green)}
  .node.sel{box-shadow:0 0 0 2px var(--gold); border-color:var(--gold)}
  .node .nid{font:800 12px ui-monospace,Menlo,Consolas,monospace; color:var(--gold)}
  .node .ntype{font-size:10px; color:var(--muted); margin-left:6px}
  .node .nbadges{float:right; display:flex; gap:4px}
  .node .nsum{display:block; margin-top:3px; font-size:12px; color:#d7cfbf;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .node .nsum .who{color:var(--gold); font-weight:700}
  .node .notedot{position:absolute; top:8px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--gold); display:none}
  .node.has-note .notedot{display:block}
  .bdg{font-size:10px; font-weight:800; padding:1px 6px; border-radius:6px; border:1px solid var(--line); color:var(--muted)}
  .bdg.start{color:var(--green); border-color:var(--green)}
  .bdg.end{color:var(--gold); border-color:var(--gold)}
  .bdg.orphan,.bdg.dead{color:var(--red); border-color:var(--red)}
  .bdg.secret{color:var(--blue); border-color:var(--blue)}

  .edgelines{margin:1px 0 4px 10px; display:flex; flex-direction:column; gap:1px}
  .edgeline{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .edgeline .tree{color:rgba(63,127,230,.7); font-family:ui-monospace,monospace}
  .edgeline .lab{color:#bdb6a6}
  .edgeline a{font-family:ui-monospace,monospace; font-weight:700; color:var(--blue); text-decoration:none; border-bottom:1px dotted var(--blue)}
  .edgeline a.broken{color:var(--red); border-color:var(--red)}
  .edgeline a.runtime{color:var(--gold); border-color:var(--gold)}
  .edgeline .rt{font-size:9px; color:var(--gold)}
  .edgeline.branchline{margin-left:16px}
  .edgeline .gate{color:var(--gold); font-size:10px; font-weight:700}
  .edgeline .cond{color:#cbb27a; font-weight:700}
  .d-edge.branchline{margin-left:16px}
  .d-edge .gate{color:var(--gold); font-size:11px; font-weight:700}
  .d-edge .cond{color:#cbb27a; font-weight:700}

  /* ---- 우측 상세 도크 ---- */
  .dock{position:fixed; top:0; right:0; z-index:40; width:min(46vw,520px); height:100dvh;
    background:#0b0c0f; border-left:1px solid rgba(216,180,93,.4); box-shadow:-20px 0 60px rgba(0,0,0,.6);
    display:none; flex-direction:column}
  .dock.open{display:flex}
  .dock-head{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:#15171b; border-bottom:1px solid var(--line)}
  .dock-title{flex:1 1 auto; min-width:0; color:var(--gold); font:800 13px ui-monospace,Menlo,Consolas,monospace;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dock-btn{border:1px solid var(--line); background:#22252b; color:var(--ink); border-radius:6px;
    padding:5px 9px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; text-decoration:none}
  .dock-btn:hover{border-color:var(--gold)}
  .dock-btn.on{background:var(--gold); color:#17130b; border-color:var(--gold)}
  .dock-frame{flex:0 0 auto; width:100%; height:0; border:0; background:#050506; transition:height .15s}
  .dock-frame.show{height:min(46vw,300px)}
  .dock-body{flex:1 1 auto; min-height:0; overflow:auto; padding:14px}
  .d-hd{font-size:12px; color:var(--muted)}
  .d-sp{font-size:13px; color:var(--gold); font-weight:800; margin-top:8px}
  .d-tx{font-size:14px; white-space:pre-line; color:#e7e0d2; margin-top:8px; border-left:2px solid var(--line); padding-left:10px}
  .d-img{width:100%; aspect-ratio:16/9; margin-top:10px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#0b0c0f}
  .d-img img{width:100%; height:100%; object-fit:contain; display:block}
  .d-img.ph{display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; border-style:dashed}
  .d-sec{margin-top:14px; border-top:1px solid var(--line); padding-top:10px}
  .d-sec h4{font-size:11px; font-weight:800; color:var(--muted); margin-bottom:7px; text-transform:uppercase; letter-spacing:.04em}
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .d-edge{font-size:12px; padding:3px 0}
  .d-edge .lab{color:#d7cfbf}
  .d-edge a{font-family:ui-monospace,monospace; font-weight:800; color:var(--blue); text-decoration:none; border-bottom:1px dotted}
  .d-edge a.broken{color:var(--red)} .d-edge a.runtime{color:var(--gold)}
  .d-note textarea{width:100%; min-height:120px; resize:vertical; border:1px solid var(--line); border-radius:8px;
    background:#101216; color:var(--ink); padding:10px; font:inherit; font-size:13px; line-height:1.5}
  .d-note textarea:focus{outline:none; border-color:var(--gold)}

  .empty{color:var(--muted); padding:40px; text-align:center}
  footer{color:var(--muted); font-size:12px; margin:30px 0 10px; text-align:center}
  @media (max-width:760px){
    body.dock-open{padding-right:18px}
    .dock{width:100vw}
  }
</style>
</head>
<body>
  <div id="app"><div class="empty">불러오는 중…</div></div>

  <!-- 게임과 같은 데이터 사용 -->
  <script src="data/scenes.js"></script>
  <script src="data/branches.js"></script>
  <script src="atlas.js"></script>
  <script>
  (function(){
    var app = document.getElementById('app');
    if(!window.STORY){ app.innerHTML = '<div class="empty">scenes.js를 못 읽었어요. game/ 폴더에서 열어주세요.</div>'; return; }
    var M = window.Atlas.build(window.STORY);
    var H = M.health;
    var START = H.start;
    var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
    var NOTE_STORAGE_KEY = 'baegeumdosi-atlas-notes-v1';
    var noteFileHandle = null;
    var notes = loadStoredNotes();

    // 씬 모델 빠른 조회
    var byId = {};
    M.groups.forEach(function(g){ g.scenes.forEach(function(s){ byId[s.id] = s; }); });

    // ----- 메인 척추(spine) 계산: start에서 "첫 엣지"만 따라간 경로 -----
    var spine = {};
    (function(){
      var cur = START, guard = 0;
      while(cur && byId[cur] && !spine[cur] && guard++ < 999){
        spine[cur] = true;
        var e = (byId[cur].edges || [])[0];
        cur = e ? e.target : null;
      }
    })();

    function summaryText(s){
      var who = s.speaker ? '<span class="who">'+esc(s.speaker)+'</span> · ' : '';
      var body = s.text || s.header || '';
      body = body.replace(/\s+/g,' ').trim();
      if(!body && !s.speaker) body = '(' + esc(s.type) + ')';
      return who + esc(body);
    }

    function badgeHTML(b){
      var map={'시작':'start','엔딩':'end','고아':'orphan','막다른':'dead','비밀':'secret'};
      return '<span class="bdg '+(map[b]||'')+'">'+esc(b)+'</span>';
    }

    function deltaChips(deltas){
      if(!deltas || !deltas.length) return '';
      return '<div class="chips">' + deltas.map(function(d){
        var cls = d.kind==='money' ? 'money' : d.kind==='flag' ? 'flag' : 'stat';
        var v = (typeof d.val==='number' && d.val>0 ? '+' : '') + d.val;
        return '<span class="chip '+cls+'">'+esc(d.name)+' <span class="v">'+esc(v)+'</span></span>';
      }).join('') + '</div>';
    }

    // ----- 흐름도 노드 -----
    function nodeHTML(s, lane){
      var cls = 'node';
      if(s.id===START) cls+=' is-start';
      else cls += spine[s.id] ? ' spine' : ' branch';
      if(s.badges.indexOf('엔딩')>=0) cls+=' is-end';
      if((notes[s.id]||'').trim()) cls+=' has-note';

      var edgeLines = s.edges.map(function(e, i){
        var last = i === s.edges.length-1;
        // 런타임 허브로 가는 엣지: "선택 → ⟨조건⟩" 한 줄 + 조건별 실제 도착지 하위 줄
        if(e.branches && e.branches.length){
          var head = '<div class="edgeline"><span class="tree">'+(last?'└':'├')+'</span> '
            + '<span class="lab">'+esc(e.label)+'</span> <span class="gate">⟨'+esc(e.gate)+'⟩</span></div>';
          var sub = e.branches.map(function(b, j){
            var lb = j === e.branches.length-1;
            return '<div class="edgeline branchline"><span class="tree">'+(lb?'└':'├')+'</span> '
              + '<span class="cond">'+esc(b.label)+'</span> '
              + '<a class="to'+(b.kind==='broken'?' broken':'')+'" href="#scene-'+esc(b.target)+'" data-jump="'+esc(b.target)+'">→ '+esc(b.target)+'</a>'
              + (b.kind==='broken'?' <span class="rt" style="color:var(--red)">없음!</span>':'')+'</div>';
          }).join('');
          return head + sub;
        }
        var toCls = 'to' + (e.kind==='broken'?' broken':e.kind==='runtime'?' runtime':'');
        var rt = e.kind==='broken' ? ' <span class="rt" style="color:var(--red)">없음!</span>' : '';
        return '<div class="edgeline"><span class="tree">'+(last?'└':'├')+'</span> '
             + '<span class="lab">'+esc(e.label)+'</span> '
             + '<a class="'+toCls+'" href="#scene-'+esc(e.target)+'" data-jump="'+esc(e.target)+'">→ '+esc(e.target)+'</a>'+rt
             + '</div>';
      }).join('');

      return '<div class="nodewrap lane-'+lane+'" style="--lane:'+lane+'">'
        + '<div class="'+cls+'" id="scene-'+esc(s.id)+'" data-scene="'+esc(s.id)+'">'
        +   '<span class="notedot"></span>'
        +   '<div class="nbadges">'+s.badges.map(badgeHTML).join('')+'</div>'
        +   '<span class="nid">'+esc(s.id)+'</span><span class="ntype">'+esc(s.type)+'</span>'
        +   '<span class="nsum">'+summaryText(s)+'</span>'
        + '</div>'
        + (edgeLines ? '<div class="edgelines">'+edgeLines+'</div>' : '')
        + '</div>';
    }

    function weekHTML(g, idx){
      var endCount = g.scenes.filter(function(s){ return s.badges.indexOf('엔딩')>=0; }).length;
      var open = idx===0 ? ' open' : '';
      var nodes = g.scenes.map(function(s){
        var lane = (s.id===START || spine[s.id]) ? 0 : 1;
        return nodeHTML(s, lane);
      }).join('');
      return '<details class="week"'+open+'>'
        + '<summary><span class="wlabel">'+esc(g.label)+'</span> <span class="wcount">'+g.scenes.length+'씬</span>'
        +   (endCount?'<span class="wend">엔딩 '+endCount+'</span>':'')+'</summary>'
        + '<div class="flow">'+nodes+'</div>'
        + '</details>';
    }

    // ----- 상세 도크 -----
    var selected = null;
    function detailHTML(s){
      var img='';
      if(s.image && s.image.kind==='file') img='<div class="d-img"><img src="'+esc(s.image.src)+'" loading="lazy" alt=""></div>';
      else if(s.image && s.image.kind==='layered') img='<div class="d-img"><img src="'+esc(s.image.src)+'" loading="lazy" alt=""></div>';
      else if(s.image && s.image.kind==='placeholder') img='<div class="d-img ph">'+esc(s.image.label||'이미지 예정')+'</div>';

      var edges = s.edges.map(function(e){
        if(e.branches && e.branches.length){
          var sub = e.branches.map(function(b){
            return '<div class="d-edge branchline"><span class="cond">'+esc(b.label)+'</span> '
              + '<a class="to'+(b.kind==='broken'?' broken':'')+'" href="#scene-'+esc(b.target)+'" data-jump="'+esc(b.target)+'">→ '+esc(b.target)+'</a>'
              + (b.kind==='broken'?' <span class="rt" style="color:var(--red)">(없음)</span>':'')+'</div>';
          }).join('');
          return '<div class="d-edge"><span class="lab">'+esc(e.label)+'</span> '
            + '<span class="gate">⟨'+esc(e.gate)+'⟩</span>'+deltaChips(e.deltas)+'</div>'+sub;
        }
        var toCls='to'+(e.kind==='broken'?' broken':e.kind==='runtime'?' runtime':'');
        var rt = e.kind==='broken'?' <span class="rt" style="color:var(--red)">(타겟 없음)</span>'
               : e.kind==='runtime'?' <span class="rt" style="color:var(--gold)">(런타임 분기)</span>':'';
        return '<div class="d-edge"><span class="lab">'+esc(e.label)+'</span> '
          + '<a class="'+toCls+'" href="#scene-'+esc(e.target)+'" data-jump="'+esc(e.target)+'">→ '+esc(e.target)+'</a>'+rt
          + deltaChips(e.deltas)+'</div>';
      }).join('') || '<div class="problem">나가는 분기 없음</div>';

      // 들어오는 링크
      var incoming = [];
      Object.keys(byId).forEach(function(id){
        byId[id].edges.forEach(function(e){ if(e.target===s.id) incoming.push({from:id, label:e.label}); });
      });
      var incHTML = incoming.length
        ? incoming.map(function(p){ return '<div class="d-edge"><a href="#scene-'+esc(p.from)+'" data-jump="'+esc(p.from)+'">'+esc(p.from)+'</a> <span class="lab">— '+esc(p.label)+'</span></div>'; }).join('')
        : '<div class="problem">들어오는 링크 없음 (시작 또는 런타임 진입)</div>';

      return '<div class="d-hd">'+esc(s.type)+(s.header?' · '+esc(s.header):'')+'</div>'
        + img
        + (s.speaker?'<div class="d-sp">'+esc(s.speaker)+'</div>':'')
        + (s.text?'<div class="d-tx">'+esc(s.text)+'</div>':'')
        + (s.deltas && s.deltas.length ? '<div class="d-sec"><h4>이 씬의 변화</h4>'+deltaChips(s.deltas)+'</div>' : '')
        + '<div class="d-sec"><h4>나가는 분기 ('+s.edges.length+')</h4>'+edges+'</div>'
        + '<div class="d-sec"><h4>들어오는 링크 ('+incoming.length+')</h4>'+incHTML+'</div>'
        + '<div class="d-sec d-note"><h4>메모</h4>'
        +   '<textarea id="dockNote" data-note-scene="'+esc(s.id)+'" placeholder="수정 지시, 대사 교체, 분기 아이디어">'+esc(notes[s.id]||'')+'</textarea>'
        + '</div>';
    }

    function selectScene(id){
      var s = byId[id]; if(!s) return;
      selected = id;
      document.querySelectorAll('.node.sel').forEach(function(n){ n.classList.remove('sel'); });
      var node = document.getElementById('scene-'+id);
      if(node){ node.classList.add('sel'); }
      // 닫힌 주차면 펼치기
      var det = node && node.closest('details.week');
      if(det && !det.open) det.open = true;
      document.getElementById('dockTitle').textContent = id;
      document.getElementById('dockBody').innerHTML = detailHTML(s);
      document.getElementById('dock').classList.add('open');
      document.body.classList.add('dock-open');
      var pop = document.getElementById('dockPop'); if(pop) pop.href = previewURL(id);
      var fr = document.getElementById('dockFrame');
      if(fr.classList.contains('show')) fr.src = previewURL(id);
    }

    function jumpTo(id){
      var node = document.getElementById('scene-'+id);
      var det = node && node.closest('details.week');
      if(det && !det.open) det.open = true;
      if(node) node.scrollIntoView({behavior:'smooth', block:'center'});
      selectScene(id);
    }

    // ----- 노트 저장/불러오기 (기존 유지) -----
    function loadStoredNotes(){ try{ return JSON.parse(localStorage.getItem(NOTE_STORAGE_KEY)||'{}')||{}; }catch(e){ return {}; } }
    function cleanNotes(obj){ var o={}; Object.keys(obj||{}).forEach(function(id){ var v=String(obj[id]==null?'':obj[id]).trim(); if(v)o[id]=v; }); return o; }
    function persistNotes(){ localStorage.setItem(NOTE_STORAGE_KEY, JSON.stringify(notes)); updateNoteCount(); }
    function orderedSceneIds(){ var ids=[]; M.groups.forEach(function(g){ g.scenes.forEach(function(s){ ids.push(s.id); }); }); return ids; }
    function serializeNotes(){
      notes = cleanNotes(notes);
      var known={}, ids=orderedSceneIds(); ids.forEach(function(id){ known[id]=true; });
      Object.keys(notes).forEach(function(id){ if(!known[id]) ids.push(id); });
      var body = ids.filter(function(id){ return notes[id]; }).map(function(id){ return '## '+id+'\n'+notes[id].trim(); }).join('\n\n');
      return '# 배금도시 아틀라스 메모\n\n'
        + '> Codex에게 "아틀라스 메모 반영해줘"라고 말하면 이 파일의 씬별 메모를 기준으로 반영합니다.\n'
        + '> 형식: `## scene_id` 아래에 수정 지시를 적습니다.\n\n'
        + (body ? body+'\n' : '');
    }
    function parseNotes(md){
      var out={}, current=null, lines=[];
      function flush(){ if(current){ var t=lines.join('\n').trim(); if(t) out[current]=t; } }
      String(md||'').split(/\r?\n/).forEach(function(line){
        var m=line.match(/^##\s+([A-Za-z0-9_.:-]+)/);
        if(m){ flush(); current=m[1]; lines=[]; } else if(current){ lines.push(line); }
      });
      flush(); return out;
    }
    function setStatus(msg,cls){ var el=document.getElementById('noteStatus'); if(!el)return; el.className='note-status'+(cls?' '+cls:''); el.textContent=msg; }
    function updateNoteCount(){ var c=Object.keys(cleanNotes(notes)).length; setStatus('메모 '+c+'개', c?'ok':''); }
    function refreshNoteDots(){
      document.querySelectorAll('.node').forEach(function(n){
        var id=n.getAttribute('data-scene'); n.classList.toggle('has-note', !!(notes[id]||'').trim());
      });
    }
    async function openNotesFile(){
      if(!window.showOpenFilePicker){ setStatus('파일 불러오기는 이 브라우저에서 미지원','warn'); return; }
      try{
        var picked=await window.showOpenFilePicker({ multiple:false, types:[{description:'Markdown',accept:{'text/markdown':['.md'],'text/plain':['.txt']}}] });
        noteFileHandle=picked[0]; var file=await noteFileHandle.getFile();
        notes=parseNotes(await file.text()); persistNotes(); refreshNoteDots();
        if(selected) selectScene(selected);
        setStatus(file.name+' 불러옴','ok');
      }catch(e){ if(e&&e.name!=='AbortError') setStatus('불러오기 실패','warn'); }
    }
    function downloadNotes(md){
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));
      a.download='atlas-notes.md'; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    }
    async function saveNotesFile(){
      var md=serializeNotes(); persistNotes();
      if(window.showSaveFilePicker){
        try{
          if(!noteFileHandle){ noteFileHandle=await window.showSaveFilePicker({ suggestedName:'atlas-notes.md', types:[{description:'Markdown',accept:{'text/markdown':['.md'],'text/plain':['.txt']}}] }); }
          var w=await noteFileHandle.createWritable(); await w.write(md); await w.close();
          setStatus('atlas-notes.md 저장됨','ok'); return;
        }catch(e){ if(e&&e.name==='AbortError') return; }
      }
      downloadNotes(md); setStatus('atlas-notes.md 다운로드됨','warn');
    }
    async function copyNotes(){
      var md=serializeNotes(); persistNotes();
      try{ await navigator.clipboard.writeText(md); setStatus('메모 md 복사됨','ok'); }
      catch(e){ setStatus('복사 실패. 저장 버튼 사용','warn'); }
    }

    function previewURL(id){ return 'index.html?preview='+encodeURIComponent(id)+'&embed=1'; }

    // ----- 헤더 / 건강검진 -----
    var endTxt = H.reachableEndings.length+'/'+H.endings.length;
    var pills = ''
      + '<span class="pill">씬 <b>'+H.sceneCount+'</b></span>'
      + '<span class="pill '+(H.reachableEndings.length===H.endings.length?'ok':'warn')+'">엔딩 도달 <b>'+endTxt+'</b></span>'
      + '<span class="pill '+(H.orphans.length?'bad':'ok')+'">고아 <b>'+H.orphans.length+'</b></span>'
      + '<span class="pill '+(H.deadends.length?'bad':'ok')+'">막다른 <b>'+H.deadends.length+'</b></span>'
      + '<span class="pill '+(H.brokenLinks.length?'bad':'ok')+'">끊긴 링크 <b>'+H.brokenLinks.length+'</b></span>';

    function jump(id){ return '<a href="#scene-'+esc(id)+'" data-jump="'+esc(id)+'">'+esc(id)+'</a>'; }
    var problems='';
    if(H.brokenLinks.length) problems+='<div class="problem red">⛔ 끊긴 링크: '+H.brokenLinks.map(function(b){ return jump(b.from)+' → <code>'+esc(b.to)+'</code>'; }).join(' · ')+'</div>';
    if(H.orphans.length) problems+='<div class="problem">🟠 고아 씬: '+H.orphans.map(jump).join(' · ')+'</div>';
    if(H.deadends.length) problems+='<div class="problem">🔴 막다른 씬: '+H.deadends.map(jump).join(' · ')+'</div>';
    if(!problems) problems='<div class="problem">✅ 끊긴 곳 없음. 모든 엔딩 도달 가능.</div>';

    var flagsHTML = M.flags.map(function(f){
      return '<span class="chip '+(f.kind==='flag'?'flag':'stat')+'">'+esc(f.name)+' <span class="v">×'+f.setAt.length+'</span></span>';
    }).join('') || '<span class="problem">아직 없음</span>';

    var weeksHTML = M.groups.map(weekHTML).join('');

    app.innerHTML =
        '<div class="toolbar">'
      +   '<h1>배금도시 — 스토리 아틀라스</h1>'
      +   '<div class="sub">주차별 세로 흐름도 · <span style="color:var(--gold)">금색</span>=메인 척추, <span style="color:var(--blue)">파랑</span>=분기. 노드 클릭 → 우측 상세.</div>'
      +   '<div class="pills">'+pills+'</div>'
      +   '<div class="note-actions">'
      +     '<a class="note-btn" href="map.html">🗺 그림 버전(노드 맵)</a>'
      +     '<button class="note-btn" id="noteOpen" type="button">노트 불러오기</button>'
      +     '<button class="note-btn primary" id="noteSave" type="button">atlas-notes.md 저장</button>'
      +     '<button class="note-btn" id="noteCopy" type="button">md 복사</button>'
      +     '<span class="note-status" id="noteStatus">메모 0개</span>'
      +   '</div>'
      + '</div>'
      + '<details class="box" open><summary>건강검진</summary><div class="pad">'+problems+'</div></details>'
      + '<details class="box"><summary>플래그 · 스탯 색인 ('+M.flags.length+')</summary><div class="pad legend">'+flagsHTML+'</div></details>'
      + weeksHTML
      + '<footer>배금도시 V1 · 아틀라스</footer>'
      + '<aside class="dock" id="dock" aria-label="씬 상세">'
      +   '<div class="dock-head">'
      +     '<span class="dock-title" id="dockTitle">씬을 클릭하세요</span>'
      +     '<button class="dock-btn" id="dockGame" type="button">게임에서 보기</button>'
      +     '<a class="dock-btn" id="dockPop" href="index.html" target="_blank" rel="noopener">새 탭</a>'
      +     '<button class="dock-btn" id="dockClose" type="button">✕</button>'
      +   '</div>'
      +   '<iframe class="dock-frame" id="dockFrame" title="씬 미리보기"></iframe>'
      +   '<div class="dock-body" id="dockBody"><div class="empty">왼쪽 흐름도에서 씬을 클릭하면 본문·분기·메모가 여기 나와요.</div></div>'
      + '</aside>';

    updateNoteCount();
    refreshNoteDots();

    // ----- 이벤트 -----
    app.addEventListener('click', function(e){
      var jumpEl = e.target.closest('[data-jump]');
      if(jumpEl){ e.preventDefault(); jumpTo(jumpEl.getAttribute('data-jump')); return; }
      var node = e.target.closest('.node');
      if(node){ selectScene(node.getAttribute('data-scene')); }
    });
    app.addEventListener('input', function(e){
      var el=e.target; if(!el.matches || !el.matches('[data-note-scene]')) return;
      var id=el.getAttribute('data-note-scene'); notes[id]=el.value;
      var n=document.getElementById('scene-'+id); if(n) n.classList.toggle('has-note', !!el.value.trim());
      persistNotes();
    });
    document.getElementById('noteOpen').addEventListener('click', openNotesFile);
    document.getElementById('noteSave').addEventListener('click', saveNotesFile);
    document.getElementById('noteCopy').addEventListener('click', copyNotes);
    document.getElementById('dockClose').addEventListener('click', function(){
      document.getElementById('dock').classList.remove('open');
      document.body.classList.remove('dock-open');
      var fr=document.getElementById('dockFrame'); fr.classList.remove('show'); fr.src='about:blank';
      document.getElementById('dockGame').classList.remove('on');
      document.querySelectorAll('.node.sel').forEach(function(n){ n.classList.remove('sel'); });
      selected=null;
    });
    document.getElementById('dockGame').addEventListener('click', function(){
      var fr=document.getElementById('dockFrame'), btn=this;
      if(fr.classList.contains('show')){ fr.classList.remove('show'); fr.src='about:blank'; btn.classList.remove('on'); }
      else if(selected){ fr.src=previewURL(selected); fr.classList.add('show'); btn.classList.add('on'); }
    });
  })();
  </script>
</body>
</html>
