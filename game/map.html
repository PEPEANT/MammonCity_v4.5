<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배금도시 — 스토리 맵 (그림)</title>
<style>
  :root{
    --ink:#f5efe2; --muted:#9a9384; --bg:#0e0f12; --panel:#181a1e; --panel2:#202329;
    --line:rgba(245,239,226,.14); --gold:#d8b45d; --red:#e0483c; --green:#1db089; --blue:#3f7fe6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"Gothic A1",system-ui,sans-serif; overflow:hidden}
  a{color:inherit}

  .topbar{position:fixed; top:0; left:0; right:0; z-index:10; height:48px; display:flex; align-items:center; gap:12px;
    padding:0 14px; background:rgba(14,15,18,.96); border-bottom:1px solid var(--line)}
  .topbar h1{font-size:15px; font-weight:800}
  .topbar .tag{font-size:12px; color:var(--muted)}
  .topbar .sp{flex:1}
  .tbtn{border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:7px;
    padding:6px 10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; text-decoration:none}
  .tbtn:hover{border-color:var(--gold)}
  .tbtn.gold{background:var(--gold); color:#17130b; border-color:var(--gold)}
  .legend{display:flex; gap:10px; font-size:11px; color:var(--muted); align-items:center}
  .legend i{display:inline-block; width:18px; height:3px; border-radius:2px; vertical-align:middle; margin-right:3px}
  .legend .l-spine{background:var(--gold)} .legend .l-branch{background:var(--blue)} .legend .l-bad{background:var(--red)}

  #viewport{position:fixed; inset:48px 0 0 0; overflow:hidden; cursor:grab; background:
    radial-gradient(circle at 1px 1px, rgba(245,239,226,.05) 1px, transparent 0) 0 0/26px 26px}
  #viewport.grabbing{cursor:grabbing}
  #world{position:absolute; top:0; left:0; transform-origin:0 0}
  #edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}
  .nodes{position:absolute; top:0; left:0}

  .bandlabel{position:absolute; font-weight:800; font-size:13px; color:var(--gold); white-space:nowrap}
  .bandlabel .c{color:var(--muted); font-weight:700; font-size:11px; margin-left:6px}
  .bandrule{position:absolute; height:1px; background:linear-gradient(90deg,rgba(216,180,93,.35),transparent)}

  .gnode{position:absolute; border:1px solid var(--line); border-left:3px solid var(--line); border-radius:9px;
    background:var(--panel2); overflow:hidden; cursor:pointer; transition:border-color .1s, box-shadow .1s}
  .gnode:hover{border-color:var(--gold)}
  .gnode.spine{border-left-color:var(--gold)}
  .gnode.branch{border-left-color:var(--blue)}
  .gnode.is-start{border-left-color:var(--green)}
  .gnode.is-end{border-left-color:#e7c879}
  .gnode.is-end .gmeta{background:#211d12}
  .gnode.sel{box-shadow:0 0 0 2px var(--gold); border-color:var(--gold)}
  .gnode.dim{opacity:.28}
  .gnode .gthumb{display:block; width:100%; height:74px; object-fit:cover; background:#0b0c0f; border-bottom:1px solid var(--line)}
  .gnode .gthumb.ph{display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:10px; font-family:ui-monospace,monospace}
  .gnode .gmeta{padding:5px 8px}
  .gnode .gid{font:800 11px ui-monospace,Menlo,Consolas,monospace; color:var(--gold); display:block;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .gnode .gsum{font-size:11px; color:#cbc4b4; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
  .gnode .gdot{position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--gold);
    display:none; box-shadow:0 0 0 2px #0b0c0f}
  .gnode.has-note .gdot{display:block}

  path.edge{fill:none; stroke:rgba(245,239,226,.16); stroke-width:1.6}
  path.edge.spine{stroke:rgba(216,180,93,.55); stroke-width:2.2}
  path.edge.branch{stroke:rgba(63,127,230,.45)}
  path.edge.bad{stroke:rgba(224,72,60,.6); stroke-dasharray:4 3}
  path.edge.hot{stroke:var(--gold); stroke-width:2.6}
  .elabel{font-size:10px; fill:var(--gold); font-weight:700; paint-order:stroke; stroke:#0e0f12; stroke-width:3px}

  .zoom{position:fixed; left:14px; bottom:14px; z-index:10; display:flex; flex-direction:column; gap:6px}
  .zoom button{width:34px; height:34px; border:1px solid var(--line); background:var(--panel2); color:var(--ink);
    border-radius:8px; font-size:18px; font-weight:800; cursor:pointer}
  .zoom button:hover{border-color:var(--gold)}
  .hint{position:fixed; right:14px; bottom:14px; z-index:9; font-size:11px; color:var(--muted);
    background:rgba(14,15,18,.8); border:1px solid var(--line); border-radius:8px; padding:6px 9px}

  /* 우측 상세 */
  .dock{position:fixed; top:48px; right:0; z-index:20; width:min(54vw,620px); height:calc(100dvh - 48px);
    background:#0b0c0f; border-left:1px solid rgba(216,180,93,.4); box-shadow:-20px 0 60px rgba(0,0,0,.6);
    display:none; flex-direction:column}
  .dock.open{display:flex}
  .dock-head{display:flex; align-items:center; gap:8px; padding:10px 12px; background:#15171b; border-bottom:1px solid var(--line)}
  .dock-title{flex:1; min-width:0; color:var(--gold); font:800 13px ui-monospace,Menlo,Consolas,monospace;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dock-btn{border:1px solid var(--line); background:#22252b; color:var(--ink); border-radius:6px;
    padding:5px 9px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; text-decoration:none}
  .dock-btn:hover{border-color:var(--gold)}
  .dock-body{flex:1; min-height:0; overflow:auto; padding:14px}
  .d-preview{width:100%; height:64vh; min-height:380px; border:1px solid rgba(216,180,93,.3); border-radius:10px;
    overflow:hidden; background:#050506; margin-bottom:12px}
  .d-preview iframe{width:100%; height:100%; border:0; display:block; background:#050506}
  .d-img{width:100%; aspect-ratio:16/9; object-fit:cover; border:1px solid var(--line); border-radius:8px; background:#0b0c0f; display:block; margin-bottom:10px}
  .d-hd{font-size:12px; color:var(--muted)} .d-sp{font-size:13px; color:var(--gold); font-weight:800; margin-top:8px}
  .d-tx{font-size:14px; white-space:pre-line; color:#e7e0d2; margin-top:8px; border-left:2px solid var(--line); padding-left:10px}
  .d-sec{margin-top:14px; border-top:1px solid var(--line); padding-top:10px}
  .d-sec h4{font-size:11px; font-weight:800; color:var(--muted); margin-bottom:7px; letter-spacing:.04em}
  .d-edge{font-size:12px; padding:3px 0} .d-edge .lab{color:#d7cfbf}
  .d-edge a{font-family:ui-monospace,monospace; font-weight:800; color:var(--blue); text-decoration:none; border-bottom:1px dotted; cursor:pointer}
  .d-edge a.broken{color:var(--red)}
  .d-edge.branchline{margin-left:16px} .d-edge .gate{color:var(--gold); font-size:11px; font-weight:700}
  .d-edge .cond{color:#cbb27a; font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chip{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; border:1px solid var(--line)}
  .chip.stat{color:#eab; border-color:rgba(224,72,60,.4)} .chip.flag{color:#9cd; border-color:rgba(63,127,230,.4)}
  .chip.money{color:var(--green); border-color:rgba(29,176,137,.4)}
  .d-note textarea{width:100%; min-height:110px; resize:vertical; border:1px solid var(--line); border-radius:8px;
    background:#101216; color:var(--ink); padding:10px; font:inherit; font-size:13px; line-height:1.5}
  .d-note textarea:focus{outline:none; border-color:var(--gold)}
  .empty{color:var(--muted); padding:40px; text-align:center}
</style>
</head>
<body>
  <div class="topbar">
    <h1>배금도시 — 스토리 맵</h1>
    <span class="tag" id="tag">불러오는 중…</span>
    <div class="legend">
      <span><i class="l-spine"></i>메인</span><span><i class="l-branch"></i>분기</span><span><i class="l-bad"></i>끊김</span>
    </div>
    <span class="sp"></span>
    <a class="tbtn" href="overview.html">📄 글 버전</a>
    <a class="tbtn gold" href="index.html" target="_blank" rel="noopener">▶ 게임</a>
  </div>

  <div id="viewport"><div id="world"><svg id="edges"></svg><div class="nodes" id="nodes"></div></div></div>

  <div class="zoom">
    <button id="zin" title="확대">+</button>
    <button id="zout" title="축소">−</button>
    <button id="zfit" title="전체 보기" style="font-size:12px">맞춤</button>
  </div>
  <div class="hint">드래그=이동 · 휠=확대/축소 · 노드 클릭=상세</div>

  <aside class="dock" id="dock">
    <div class="dock-head">
      <span class="dock-title" id="dockTitle">씬을 클릭하세요</span>
      <a class="dock-btn" id="dockPop" href="index.html" target="_blank" rel="noopener">↗ 새 탭</a>
      <button class="dock-btn" id="dockClose" type="button">✕</button>
    </div>
    <div class="dock-body" id="dockBody"><div class="empty">노드를 클릭하면 본문·분기·메모가 여기 나와요.</div></div>
  </aside>

  <script src="data/scenes.js"></script>
  <script src="data/branches.js"></script>
  <script src="atlas.js"></script>
  <script>
  (function(){
    var tag = document.getElementById('tag');
    if(!window.STORY){ tag.textContent = 'scenes.js를 못 읽음'; return; }
    var M = window.Atlas.build(window.STORY);
    var H = M.health;
    var START = H.start;
    var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
    var NOTE_KEY = 'baegeumdosi-atlas-notes-v1'; // 글 버전과 공유
    var notes = (function(){ try{ return JSON.parse(localStorage.getItem(NOTE_KEY)||'{}')||{}; }catch(e){ return {}; } })();

    var byId = {};
    M.groups.forEach(function(g){ g.scenes.forEach(function(s){ byId[s.id] = s; }); });

    // 메인 척추: start에서 첫 엣지만 따라간 경로
    var spine = {};
    (function(){ var cur=START, n=0; while(cur && byId[cur] && !spine[cur] && n++<999){ spine[cur]=true;
      var e=(byId[cur].edges||[])[0]; cur = e ? (e.branches&&e.branches[0]?e.branches[0].target:e.target) : null; } })();

    // ---- 그래프 엣지(런타임 허브는 실제 도착지로 펼침) ----
    function realEdges(s){
      var out=[];
      (s.edges||[]).forEach(function(e){
        if(e.branches && e.branches.length){
          e.branches.forEach(function(b){ out.push({ to:b.target, label:b.label, gate:e.gate, kind:b.kind }); });
        } else {
          out.push({ to:e.target, label:e.label, kind:e.kind });
        }
      });
      return out;
    }

    // ---- 레이아웃: 깊이(BFS)=세로 레이어, 주차=가로 구분선 ----
    var NW=158, NH=116, STEPX=184, STEPY=180, TOP=50;
    var world = document.getElementById('world');
    var svg = document.getElementById('edges');
    var nodesEl = document.getElementById('nodes');
    function summaryText(s){
      var body = (s.text || s.header || '').replace(/\s+/g,' ').trim();
      return s.speaker ? (s.speaker + (body?': '+body:'')) : (body || '('+s.type+')');
    }
    function thumbHTML(s){
      var im = s.image;
      if(im && (im.kind==='file' || im.kind==='layered'))
        return '<img class="gthumb" src="'+esc(im.src)+'" loading="lazy" alt="" data-fallback="'+esc(s.type)+'">';
      return '<div class="gthumb ph">'+esc((im&&im.label)||s.type)+'</div>';
    }

    // 부모/자식 (실제 존재하는 씬 사이의 링크만)
    var parents={}, children={};
    Object.keys(byId).forEach(function(id){ parents[id]=[]; children[id]=[]; });
    Object.keys(byId).forEach(function(id){
      realEdges(byId[id]).forEach(function(e){ if(byId[e.to]){ children[id].push(e.to); parents[e.to].push(id); } });
    });

    // 깊이: start에서 BFS 최단거리 (= 세로 위치)
    var depth={}; depth[START]=0; var bfs=[START];
    while(bfs.length){ var cid=bfs.shift(); children[cid].forEach(function(t){ if(depth[t]==null){ depth[t]=depth[cid]+1; bfs.push(t); } }); }
    var maxD=0; Object.keys(depth).forEach(function(id){ maxD=Math.max(maxD, depth[id]); });
    Object.keys(byId).forEach(function(id){ if(depth[id]==null) depth[id]=++maxD; }); // 미도달은 맨 아래

    // 레이어 배열
    var layers=[]; for(var d=0; d<=maxD; d++) layers[d]=[];
    Object.keys(byId).forEach(function(id){ layers[depth[id]].push(id); });
    var idx={}; function reindex(){ layers.forEach(function(arr){ arr.forEach(function(id,i){ idx[id]=i; }); }); }
    reindex();

    // 교차 줄이기: 바리센터 위/아래 스윕 여러 번
    function sweep(down){
      for(var k=0;k<layers.length;k++){
        var L = down ? k : layers.length-1-k;
        if(down && L===0) continue; if(!down && L===layers.length-1) continue;
        var key={};
        layers[L].forEach(function(id){
          var nb=(down?parents[id]:children[id]).filter(function(n){ return depth[n]===(down?L-1:L+1); });
          if(nb.length){ var s=0; nb.forEach(function(n){ s+=idx[n]; }); key[id]=s/nb.length; }
          else key[id]=idx[id];
        });
        layers[L].sort(function(a,b){ return key[a]-key[b]; });
        layers[L].forEach(function(id,i){ idx[id]=i; });
      }
    }
    for(var it=0; it<6; it++) sweep(it%2===0);

    // 좌표: 위→아래로 부모 평균 x에 맞춰 직선화, 최소 간격 유지
    var pos={};
    layers.forEach(function(arr, L){
      var des = arr.map(function(id){
        var ap=parents[id].filter(function(p){ return depth[p]===L-1 && pos[p]; });
        if(ap.length){ var s=0; ap.forEach(function(p){ s+=pos[p].x; }); return s/ap.length; }
        return idx[id]*STEPX;
      });
      var xs=[]; for(var i=0;i<arr.length;i++){ xs[i] = i===0 ? des[i] : Math.max(des[i], xs[i-1]+STEPX); }
      // 패킹된 줄을 desired 중심에 맞춰 재정렬(우측 쏠림 방지)
      var ad=des.reduce(function(a,b){return a+b;},0)/(des.length||1);
      var ax=xs.reduce(function(a,b){return a+b;},0)/(xs.length||1);
      var sh=ad-ax;
      arr.forEach(function(id,i){ pos[id]={ x:xs[i]+sh, y:L*STEPY+TOP }; });
    });

    // 양수 좌표로 시프트 + 캔버스 크기
    var minX=Infinity, maxX=-Infinity;
    Object.keys(pos).forEach(function(id){ minX=Math.min(minX,pos[id].x); maxX=Math.max(maxX,pos[id].x+NW); });
    var shiftX=-minX+60; Object.keys(pos).forEach(function(id){ pos[id].x+=shiftX; });
    var totalW=(maxX-minX)+120;
    var totalH=(maxD+1)*STEPY+TOP+40;
    svg.setAttribute('width', totalW); svg.setAttribute('height', totalH);
    world.style.width = totalW+'px'; world.style.height = totalH+'px';

    // 주차 구분선: 레이어 대표 주차가 바뀌면 가로줄+라벨
    function layerWeek(L){ var c={}; layers[L].forEach(function(id){ var w=byId[id].group.label; c[w]=(c[w]||0)+1; });
      var best=null,bn=-1; Object.keys(c).forEach(function(w){ if(c[w]>bn){bn=c[w];best=w;} }); return best; }
    var dividers=''; var prevW=null;
    for(var L=0; L<=maxD; L++){
      var w=layerWeek(L); if(w==null) continue;
      if(w!==prevW){
        var yd=L*STEPY+TOP-28;
        dividers += '<div class="bandrule" style="left:0; top:'+yd+'px; width:'+totalW+'px"></div>'
          + '<div class="bandlabel" style="left:8px; top:'+(yd+4)+'px">'+esc(w)+'</div>';
        prevW=w;
      }
    }

    // 노드
    var html = dividers;
    Object.keys(byId).forEach(function(id){
      var s = byId[id], p = pos[id]; if(!p) return;
      var cls='gnode';
      if(id===START) cls+=' is-start'; else cls += spine[id]?' spine':' branch';
      if(s.badges.indexOf('엔딩')>=0) cls+=' is-end';
      if((notes[id]||'').trim()) cls+=' has-note';
      html += '<div class="'+cls+'" id="n-'+esc(id)+'" data-id="'+esc(id)+'" '
        + 'style="left:'+p.x+'px; top:'+p.y+'px; width:'+NW+'px; height:'+NH+'px">'
        + '<span class="gdot"></span>'
        + thumbHTML(s)
        + '<div class="gmeta"><span class="gid">'+esc(id)+'</span>'
        + '<span class="gsum">'+esc(summaryText(s))+'</span></div></div>';
    });
    nodesEl.innerHTML = html;
    // 이미지 깨지면 타입 라벨 박스로 대체
    nodesEl.querySelectorAll('img.gthumb').forEach(function(img){
      img.addEventListener('error', function(){
        var box=document.createElement('div'); box.className='gthumb ph';
        box.textContent=img.getAttribute('data-fallback')||'';
        img.replaceWith(box);
      });
    });

    // 엣지 path (아래로 가는 건 세로 베지어, 역방향/같은레이어는 옆으로 우회)
    var edgeList = [];
    Object.keys(byId).forEach(function(id){
      var from = pos[id]; if(!from) return;
      realEdges(byId[id]).forEach(function(e){
        var to = pos[e.to];
        var x1=from.x+NW/2, y1=from.y+NH, x2, y2, d, kind;
        if(!to){ x2=x1; y2=y1+30; d='M'+x1+','+y1+' L'+x2+','+y2; kind='bad'; }
        else {
          x2=to.x+NW/2; y2=to.y;
          kind = e.kind==='broken'?'bad':(spine[id]&&spine[e.to]?'spine':(e.gate?'branch':'norm'));
          if(depth[e.to] > depth[id]){
            var dy=Math.max(28,(y2-y1)/2);
            d='M'+x1+','+y1+' C'+x1+','+(y1+dy)+' '+x2+','+(y2-dy)+' '+x2+','+y2;
          } else { // 위/옆으로 돌아가는 링크: 오른쪽으로 우회 곡선
            var midx=Math.max(x1,x2)+90;
            d='M'+x1+','+y1+' C'+midx+','+y1+' '+midx+','+y2+' '+x2+','+y2;
          }
        }
        edgeList.push({ from:id, to:e.to, d:d, kind:kind });
      });
    });
    var svgNS='http://www.w3.org/2000/svg';
    edgeList.forEach(function(e, i){
      var p=document.createElementNS(svgNS,'path');
      p.setAttribute('d', e.d); p.setAttribute('class','edge'+(e.kind!=='norm'?' '+e.kind:''));
      p.setAttribute('data-from', e.from); p.setAttribute('data-to', e.to); p.dataset.idx=i;
      svg.appendChild(p);
    });

    // ---- 팬/줌 ----
    var vp=document.getElementById('viewport');
    var tx=40, ty=20, scale=0.8;
    function apply(){ world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; }
    apply();
    var dragging=false, sx, sy, stx, sty, moved=false;
    vp.addEventListener('mousedown', function(e){ moved=false; if(e.target.closest('.gnode'))return; dragging=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; vp.classList.add('grabbing'); });
    window.addEventListener('mousemove', function(e){ if(!dragging)return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>3)moved=true; apply(); });
    window.addEventListener('mouseup', function(){ dragging=false; vp.classList.remove('grabbing'); });
    vp.addEventListener('wheel', function(e){ e.preventDefault();
      var rect=vp.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
      var f=e.deltaY<0?1.12:0.89, ns=Math.max(0.18, Math.min(2.4, scale*f));
      tx = mx-(mx-tx)*(ns/scale); ty = my-(my-ty)*(ns/scale); scale=ns; apply();
    }, {passive:false});
    function fit(){
      var rect=vp.getBoundingClientRect();
      scale=Math.min(2, Math.max(0.18, Math.min((rect.width-40)/totalW,(rect.height-40)/totalH)));
      tx=(rect.width-totalW*scale)/2; ty=20; apply();
    }
    document.getElementById('zin').onclick=function(){ scale=Math.min(2.4,scale*1.2); apply(); };
    document.getElementById('zout').onclick=function(){ scale=Math.max(0.18,scale*0.83); apply(); };
    document.getElementById('zfit').onclick=fit;

    // ---- 선택 / 상세 ----
    var selected=null;
    function previewURL(id){ return 'index.html?preview='+encodeURIComponent(id)+'&embed=1'; }
    function deltaChips(deltas){
      if(!deltas||!deltas.length) return '';
      return '<div class="chips">'+deltas.map(function(d){
        var cls=d.kind==='money'?'money':d.kind==='flag'?'flag':'stat';
        var v=(typeof d.val==='number'&&d.val>0?'+':'')+d.val;
        return '<span class="chip '+cls+'">'+esc(d.name)+' <span class="v">'+esc(v)+'</span></span>';
      }).join('')+'</div>';
    }
    function detailHTML(s){
      var edges=s.edges.map(function(e){
        if(e.branches&&e.branches.length){
          var sub=e.branches.map(function(b){
            return '<div class="d-edge branchline"><span class="cond">'+esc(b.label)+'</span> '
              +'<a class="'+(b.kind==='broken'?'broken':'')+'" data-jump="'+esc(b.target)+'">→ '+esc(b.target)+'</a></div>';
          }).join('');
          return '<div class="d-edge"><span class="lab">'+esc(e.label)+'</span> <span class="gate">⟨'+esc(e.gate)+'⟩</span>'+deltaChips(e.deltas)+'</div>'+sub;
        }
        return '<div class="d-edge"><span class="lab">'+esc(e.label)+'</span> '
          +'<a class="'+(e.kind==='broken'?'broken':'')+'" data-jump="'+esc(e.target)+'">→ '+esc(e.target)+'</a>'+deltaChips(e.deltas)+'</div>';
      }).join('') || '<div class="empty" style="padding:10px">나가는 분기 없음</div>';

      var inc=[]; Object.keys(byId).forEach(function(id){ realEdges(byId[id]).forEach(function(e){ if(e.to===s.id) inc.push(id); }); });
      var incHTML = inc.length ? inc.map(function(p){ return '<div class="d-edge"><a data-jump="'+esc(p)+'">'+esc(p)+'</a></div>'; }).join('')
        : '<div class="empty" style="padding:10px">들어오는 링크 없음</div>';

      // 실제 게임 엔진으로 그 씬을 렌더한 라이브 미리보기 (글 안 짤리고 그대로 보임)
      var prev = '<div class="d-preview"><iframe src="'+esc(previewURL(s.id))+'" title="씬 미리보기" loading="lazy"></iframe></div>';
      return prev
        + '<div class="d-hd">'+esc(s.type)+(s.header?' · '+esc(s.header):'')+'</div>'
        + (s.speaker?'<div class="d-sp">'+esc(s.speaker)+'</div>':'')
        + (s.text?'<div class="d-tx">'+esc(s.text)+'</div>':'')
        + (s.deltas&&s.deltas.length?'<div class="d-sec"><h4>이 씬의 변화</h4>'+deltaChips(s.deltas)+'</div>':'')
        + '<div class="d-sec"><h4>나가는 분기 ('+s.edges.length+')</h4>'+edges+'</div>'
        + '<div class="d-sec"><h4>들어오는 링크 ('+inc.length+')</h4>'+incHTML+'</div>'
        + '<div class="d-sec d-note"><h4>메모 (글 버전과 공유)</h4>'
        +   '<textarea data-note-scene="'+esc(s.id)+'" placeholder="수정 지시, 분기 아이디어">'+esc(notes[s.id]||'')+'</textarea></div>';
    }
    function highlightEdges(id){
      svg.querySelectorAll('path.edge').forEach(function(p){
        var on = p.getAttribute('data-from')===id;
        p.classList.toggle('hot', on);
      });
    }
    function select(id){
      var s=byId[id]; if(!s) return;
      selected=id;
      nodesEl.querySelectorAll('.gnode.sel').forEach(function(n){ n.classList.remove('sel'); });
      var n=document.getElementById('n-'+id); if(n) n.classList.add('sel');
      highlightEdges(id);
      document.getElementById('dockTitle').textContent=id;
      document.getElementById('dockBody').innerHTML=detailHTML(s);
      document.getElementById('dockPop').href=previewURL(id);
      document.getElementById('dock').classList.add('open');
    }
    function centerOn(id){
      var p=pos[id]; if(!p) return; var rect=vp.getBoundingClientRect();
      tx = rect.width/2 - (p.x+NW/2)*scale; ty = rect.height/2 - (p.y+NH/2)*scale; apply();
    }

    nodesEl.addEventListener('click', function(e){
      var node=e.target.closest('.gnode'); if(!node) return;
      if(moved) return; // 드래그였으면 무시
      select(node.getAttribute('data-id'));
    });
    document.getElementById('dockBody').addEventListener('click', function(e){
      var j=e.target.closest('[data-jump]'); if(!j) return; e.preventDefault();
      var id=j.getAttribute('data-jump'); if(byId[id]){ select(id); centerOn(id); }
    });
    document.getElementById('dockBody').addEventListener('input', function(e){
      var el=e.target; if(!el.matches('[data-note-scene]')) return;
      var id=el.getAttribute('data-note-scene'); notes[id]=el.value;
      var n=document.getElementById('n-'+id); if(n) n.classList.toggle('has-note', !!el.value.trim());
      try{ localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); }catch(err){}
    });
    document.getElementById('dockClose').onclick=function(){
      document.getElementById('dock').classList.remove('open');
      nodesEl.querySelectorAll('.gnode.sel').forEach(function(n){ n.classList.remove('sel'); });
      svg.querySelectorAll('path.hot').forEach(function(p){ p.classList.remove('hot'); });
      selected=null;
    };

    tag.textContent = H.sceneCount+'씬 · 고아 '+H.orphans.length+' · 엔딩 '+H.reachableEndings.length+'/'+H.endings.length;
    fit();
  })();
  </script>
</body>
</html>
